name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # P2 处置轮（perf 路发现）：20=engines 下限锚点（已 EOL 2026-04，只守地板）/
        # 22=maintenance LTS / 24=active LTS——search-local.spec 的 node:sqlite 依赖
        # NODE_MAJOR>=23，此前矩阵 [20,22] 两节点全 skip（v1.17 特性在 CI 零行为
        # 覆盖）；加 24 后该文件 40 测在 CI 真跑（本地 24.12 全量已验证）。
        node: [20, 22]  # 24 于 2026-08-31 试加后回退：linux node:sqlite 运行时漂移致 search-local 假失败（mac 全绿）——待有 Linux 调试环境再攻（P2 台账 12）
    steps:
      # P2 处置轮：checkout v4 / setup-node v4 均为 node20 runtime（GitHub 已弃用，
      # 2026-06 起强制 node24）——升当前最新大版本：checkout v7.0.1 / setup-node
      # v6.4.0（2026-08-31 releases 页核真；setup-node v6 破坏面=自动缓存限 npm，
      # 本仓本就显式 cache: npm，无影响）。远程 CI 结论待主循环 push 后回查。
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # 门禁三件套与本地同序：build 出 dist → 全量测试 → 架构不变量
      # （dist 是测试的依赖面之一；rust-helper/macOS 专属路径在测试内均为
      #   platform 注入或 non-darwin no-op 分支，Linux 上应全绿——若有平台
      #   假设残留，红了就是抓到了，修掉即可）
      - run: npm run build
      - run: npm test
      - run: npm run check-invariants
